<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AquaMed — Davet</title>
<style>
:root{--bg:#F5F2EC;--panel:#fff;--ink:#14231F;--muted:#5A6B66;--line:#E3DED4;--accent:#0F766E;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#061016;--panel:#0E1C22;--ink:#E6F1EF;--muted:#9AB0AB;--line:#1F343B;--accent:#5EEAD4;--on:#062320}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:36px 18px 56px;text-align:center}
h1{font-size:24px;line-height:1.25;margin:0 0 8px}
p{margin:8px 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 16px;margin:22px 0}
.label{font-size:14px;color:var(--muted);margin:0}
.code{font:700 40px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--ink);margin:6px 0 0;word-break:keep-all}
.btn{display:block;width:100%;padding:15px 18px;margin:10px 0;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on);font-size:17px;font-weight:600;text-decoration:none}
.btn.alt{background:transparent;color:var(--accent)}
.steps{text-align:left;color:var(--ink);padding-left:22px}
.err{color:#B42318}
@media (prefers-color-scheme:dark){.err{color:#FDA29B}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p id="lead"></p>
<div class="card" id="codeCard" hidden>
  <p class="label" id="codeLabel"></p>
  <p class="code" id="code" aria-live="polite"></p>
</div>
<p class="err" id="err" role="alert" hidden></p>
<a class="btn" id="open" href="#" hidden></a>
<a class="btn alt" id="play" href="#"></a>
<div id="howBox" hidden>
  <p id="howTitle"><strong></strong></p>
  <ol class="steps" id="how"></ol>
</div>
</main>
<script>
(function () {
  var PLAY = 'https://play.google.com/store/apps/details?id=com.aquamed.tracker';
  var T = {
    tr: {
      title: 'AquaMed daveti', lead: 'Bir yakınınız sizi AquaMed\'de ilaç takibine davet etti.',
      codeLabel: 'Eşleşme kodu', open: 'AquaMed\'i aç', play: 'Google Play\'den indir',
      bad: 'Bu davet bağlantısındaki kod geçersiz görünüyor. Kodun 8 rakam olması gerekir; davet eden kişiden bağlantıyı yeniden göndermesini isteyin.',
      none: 'Bu bağlantıda eşleşme kodu yok. Davet eden kişiden bağlantıyı yeniden göndermesini isteyin.',
      howTitle: 'Uygulama açılmazsa', how: ['AquaMed\'i Google Play\'den kurun.', 'Ayarlar → Yakınlar bölümüne girin.', 'Yukarıdaki kodu girin (kod 10 dakika geçerlidir).']
    },
    en: {
      title: 'AquaMed invitation', lead: 'Someone invited you to follow their medication in AquaMed.',
      codeLabel: 'Pairing code', open: 'Open AquaMed', play: 'Get it on Google Play',
      bad: 'The code in this invite link looks invalid. It must be 8 digits; ask the person who invited you to send the link again.',
      none: 'This link has no pairing code. Ask the person who invited you to send the link again.',
      howTitle: 'If the app does not open', how: ['Install AquaMed from Google Play.', 'Go to Settings → Caregivers.', 'Enter the code above (it is valid for 10 minutes).']
    }
  };
  var lang = /^tr/i.test(navigator.language || '') ? 'tr' : 'en';
  var L = T[lang], $ = function (id) { return document.getElementById(id); };
  document.documentElement.lang = lang;
  document.title = 'AquaMed — ' + L.title;
  $('title').textContent = L.title; $('lead').textContent = L.lead;
  $('codeLabel').textContent = L.codeLabel; $('open').textContent = L.open; $('play').textContent = L.play;
  $('play').href = PLAY;

  var q = new URLSearchParams(location.search);
  var raw = (q.get('kod') || q.get('code') || '').replace(/\s+/g, '');
  var test = q.get('test') === '1';
  var android = /Android/i.test(navigator.userAgent);
  var code = /^[0-9]{8}$/.test(raw) ? raw : '';   // digits only: nothing else is ever rendered

  if (!code) {
    var e = $('err'); e.textContent = raw ? L.bad : L.none; e.hidden = false;
    return;
  }
  $('code').textContent = code.slice(0, 4) + ' ' + code.slice(4);
  $('codeCard').hidden = false;

  $('howTitle').firstChild.textContent = L.howTitle;
  L.how.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; $('how').appendChild(li); });
  $('howBox').hidden = false;

  if (android) {
    var scheme = test ? 'aquamed-test' : 'aquamed', pkg = test ? 'com.aquamed.tracker.test' : 'com.aquamed.tracker';
    var url = 'intent://pair?code=' + code + '#Intent;scheme=' + scheme + ';package=' + pkg +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
    var b = $('open'); b.href = url; b.hidden = false;
    var tried = false;
    try { tried = sessionStorage.getItem('davet-' + code) === '1'; sessionStorage.setItem('davet-' + code, '1'); } catch (x) {}
    if (!tried) location.href = url;   // once per tab and code; the button stays for retries
  }
})();
</script>
</body>
</html>
